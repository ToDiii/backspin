name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      # Ohne VITE_APP_URL leitet die App ihre Redirect-URI aus
      # window.location.origin ab, genau wie beim Build auf dem Host.
      - name: Build
        run: npm run build
      # Der Layout-Test misst im echten Browser gegen das gebaute dist/,
      # deshalb laeuft er nach dem Build und braucht ein Chromium.
      - name: Chromium fuer den Layout-Test
        run: npx playwright install --with-deps chromium
      - name: Layout-Test (320/375/414 px)
        run: npm run test:layout
